services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navi
      POSTGRES_USER: ${DB_USERNAME:-navi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5452:5432"
    volumes:
      - navi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-navi} -d navi"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/navi
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  navi-db:
