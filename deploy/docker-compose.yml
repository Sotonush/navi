x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: navi
      POSTGRES_USER: ${DB_USERNAME:-navi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - navi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-navi} -d navi"]
      interval: 5s
      retries: 10

  navi:
    <<: *defaults
    build: ..
    image: navi:prod
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/navi
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    <<: *defaults
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - navi

  tunnel:
    <<: *defaults
    image: cloudflare/cloudflared:2025.10.0
    command: tunnel --no-autoupdate --url http://caddy:80
    depends_on:
      - caddy

volumes:
  navi_db:
  caddy_data:
  caddy_config:
